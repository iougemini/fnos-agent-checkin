# 飞牛 OS / 任何 Docker Compose：Trae + WorkBuddy + Qoder 签到控制台
# 启动：docker compose up -d --build
# 控制台：http://<飞牛IP>:8787

services:
  checkin:
    image: fnos-agent-checkin:latest
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: fnos-agent-checkin
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      TZ: Asia/Shanghai
      PORT: "8787"
      DATA_DIR: /data
      HOST: 0.0.0.0
      MASTER_KEY: ${MASTER_KEY:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      CRON_SECRET: ${CRON_SECRET:-}
      CRON_ENABLED: ${CRON_ENABLED:-1}
      CRON_CATCHUP: ${CRON_CATCHUP:-1}
      CRON_JITTER_MIN_SEC: ${CRON_JITTER_MIN_SEC:-0}
      CRON_JITTER_MAX_SEC: ${CRON_JITTER_MAX_SEC:-900}
      TG_BOT_TOKEN: ${TG_BOT_TOKEN:-}
      TG_CHAT_ID: ${TG_CHAT_ID:-}
      TG_API_BASE: ${TG_API_BASE:-}
      QQ_APP_ID: ${QQ_APP_ID:-}
      QQ_APP_SECRET: ${QQ_APP_SECRET:-}
      QQ_OPENID: ${QQ_OPENID:-}
      QQ_SANDBOX: ${QQ_SANDBOX:-}
      QODER_MACHINE_TOKEN: ${QODER_MACHINE_TOKEN:-}
      QODER_MACHINE_CODE: ${QODER_MACHINE_CODE:-}
      QODER_MACHINE_TYPE: ${QODER_MACHINE_TYPE:-}
    volumes:
      - fnos-agent-checkin-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  fnos-agent-checkin-data:
    name: fnos-agent-checkin-data
