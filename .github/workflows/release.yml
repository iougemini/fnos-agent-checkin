name: Release image and fnOS package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "可选，例如 v1.0.0。填写后创建该 Release 并附上 fpk，同时推送该版本镜像和 :latest。留空则只上传 Artifact，镜像标签为 manual。"
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Image name and version
        id: meta
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            latest=1
          elif [[ -n "${RELEASE_TAG}" ]]; then
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9] ]]; then
              echo "release_tag 必须以 v 加数字开头，例如 v1.0.0" >&2
              exit 1
            fi
            version="${RELEASE_TAG#v}"
            latest=1
          else
            version="manual"
            latest=0
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "${image}:${version}"
            if [ "$latest" = 1 ]; then
              echo "${image}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  fpk:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack fnOS fpk
        env:
          VERSION: ${{ needs.image.outputs.version }}
          IMAGE: ${{ needs.image.outputs.image }}
        run: |
          set -euo pipefail
          chmod +x scripts/build-fpk.sh fpk/cmd/main
          scripts/build-fpk.sh "$VERSION" "$IMAGE" "dist/fnos-agent-checkin-${VERSION}.fpk"
          python3 - << PY
          import json, os
          from pathlib import Path
          version = os.environ["VERSION"]
          image = os.environ["IMAGE"]
          Path("dist/latest.json").write_text(json.dumps({
              "version": version,
              "image": f"{image}:{version}",
              "fpk": f"fnos-agent-checkin-{version}.fpk",
          }, ensure_ascii=False, indent=2) + "\n")
          PY

      - name: Upload fpk artifact
        uses: actions/upload-artifact@v4
        with:
          name: fnos-agent-checkin-${{ needs.image.outputs.version }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/fnos-agent-checkin-${{ needs.image.outputs.version }}.fpk
            dist/fnos-agent-checkin-${{ needs.image.outputs.version }}.fpk.sha256
            dist/latest.json

      - name: Attach to GitHub Release
        if: github.event_name == 'push' || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          files: |
            dist/fnos-agent-checkin-${{ needs.image.outputs.version }}.fpk
            dist/fnos-agent-checkin-${{ needs.image.outputs.version }}.fpk.sha256
            dist/latest.json
          generate_release_notes: true
          fail_on_unmatched_files: true
